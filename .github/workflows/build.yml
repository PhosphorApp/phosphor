name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    # Builds the host app + DofBridge only. Plug-ins live in the separate phosphor-plugins
    # repo and are NOT built here; the host restores the Phosphor.Plugin.Abstractions package
    # from NuGet. A plug-in snapshot is folded in by the release workflow, not this CI build.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore packages
        run: dotnet restore

      - name: Build Release
        run: dotnet build --no-restore --configuration Release -p:Version=1.0.0.${{ github.run_number }} -p:AssemblyVersion=1.0.0.${{ github.run_number }} -p:FileVersion=1.0.0.${{ github.run_number }}

      - name: Extract ProjectM presets (Release)
        run: |
          $outputDir = "Phosphor\bin\Release\net8.0-windows\presets"
          Expand-Archive -Path "dependencies\projectM\ProjectM_Presets_Base.zip" -DestinationPath $outputDir -Force
        shell: pwsh

      - name: Upload Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phosphor-Release
          path: Phosphor/bin/Release/net8.0-windows/
          retention-days: 5
