name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore packages
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Extract ProjectM presets
        run: |
          $outputDir = "VpinJukebox\bin\Release\net8.0-windows\presets"
          Expand-Archive -Path "dependencies\projectM\ProjectM_Presets_Base.zip" -DestinationPath $outputDir -Force
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phosphor
          path: VpinJukebox/bin/Release/net8.0-windows/
