name: Release

# Produces a client snapshot: the host app + a point-in-time build of phosphor-plugins folded in.
# Distribution model = the client release IS the plugin snapshot (no in-app updater). The plugins
# commit SHA is stamped into build-info.json for traceability (a given release is always traceable to
# the exact plugin source it shipped). Plugin source selection: if phosphor-plugins carries a tag
# matching this host tag, that tagged source is pinned (a reproducible host+plugins pair); otherwise
# it falls back to plugins master HEAD (latest) with a warning — see the "Resolve plugins ref" step.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout host
        uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        # Versioning model: major.minor.build, where you tag major.minor and CI auto-fills the build
        # number (PATCH) from github.run_number. The prerelease suffix (-tester / -rc) is a bare
        # CHANNEL marker, not a counter — the ever-increasing build number carries the ordering, and
        # it lives in exactly one place (PATCH) so it isn't duplicated in the suffix.
        # Supported tag shapes (with or without a leading 'v'):
        #   v1.2            -> version 1.2.<run#>            label v1.2.<run#>            (release)
        #   v1.2-tester     -> version 1.2.<run#>            label v1.2.<run#>-tester     (PRERELEASE)
        #   v1.2-rc         -> version 1.2.<run#>            label v1.2.<run#>-rc         (PRERELEASE)
        #   v1.2.3          -> version 1.2.3                 label v1.2.3                 (release, pinned build)
        #   v1.2.3-rc       -> version 1.2.3                 label v1.2.3-rc              (PRERELEASE, pinned build)
        #   (non-tag / manual dispatch) -> version 0.0.0     label 0.0.0-dev-<ref>-<run#> (artifact only)
        # Outputs:
        #   version    = clean numeric AssemblyVersion/FileVersion (always X.Y.Z, no suffix)
        #   label      = full display/file name (may carry a -suffix)
        #   prerelease = 'true' when the tag has a -suffix
        run: |
          $ref = "${{ github.ref_name }}"
          $run = "${{ github.run_number }}"
          $isTag = "${{ github.ref_type }}" -eq "tag"
          $prerelease = "false"

          if ($isTag -and $ref -match '^v?(\d+)\.(\d+)(?:\.(\d+))?(-.+)?$') {
            $maj = $Matches[1]; $min = $Matches[2]
            $build = if ($Matches[3]) { $Matches[3] } else { $run }   # auto build number when omitted
            $suffix = $Matches[4]                                      # e.g. -tester / -rc (bare channel marker; may be empty)
            $version = "$maj.$min.$build"                              # clean numeric core for assembly
            $label   = "v$version$suffix"
            if ($suffix) { $prerelease = "true" }
          } else {
            $version = "0.0.0"
            $label   = "0.0.0-dev-$ref-$run"
          }

          "version=$version"       >> $env:GITHUB_OUTPUT
          "label=$label"           >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved version=$version label=$label prerelease=$prerelease (ref_type=${{ github.ref_type }}, ref=$ref)"

      - name: Guard against committed local NuGet sources
        shell: pwsh
        # A file-based (local) package source committed into nuget.config points at a folder that
        # only exists on a dev machine (e.g. ..\local-nuget). CI has no such folder and NuGet
        # HARD-ERRORS on a missing local source path, failing restore with a confusing message.
        # Fail fast here with a clear reason instead. Only non-http(s) sources are flagged, so the
        # nuget.org feed is fine; a genuine CI mirror would use an http(s) URL.
        run: |
          $bad = @()
          foreach ($cfg in Get-ChildItem -Recurse -File -Filter 'nuget.config' -ErrorAction SilentlyContinue) {
            try { [xml]$xml = Get-Content $cfg.FullName -Raw } catch { continue }
            foreach ($src in $xml.configuration.packageSources.add) {
              $val = "$($src.value)"
              if ($val -and $val -notmatch '^(?i)https?://') {
                $bad += "  $($cfg.FullName): <add key=""$($src.key)"" value=""$val"" />"
              }
            }
          }
          if ($bad.Count -gt 0) {
            Write-Error ("Committed local NuGet source(s) detected — these break CI restore (the path doesn't exist on the runner). Remove them from nuget.config and add local feeds locally instead:`n" + ($bad -join "`n"))
            exit 1
          }
          Write-Host "No committed local NuGet sources found."

      - name: Build host (Release)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          # AssemblyVersion/FileVersion take the clean numeric core; InformationalVersion carries the
          # full label (channel suffix included, minus the leading 'v') so the app/log can display the
          # exact build/channel — e.g. "0.9.35-rc" — that a tester is running.
          $info = "${{ steps.ver.outputs.label }}" -replace '^v', ''
          dotnet build Phosphor.slnx --configuration Release `
            -p:Version=$v -p:AssemblyVersion=$v -p:FileVersion=$v -p:InformationalVersion=$info

      - name: Resolve host output dir
        id: host
        shell: pwsh
        run: echo "dir=$(Resolve-Path 'Phosphor/bin/Release/net8.0-windows')" >> $env:GITHUB_OUTPUT

      - name: Extract ProjectM presets
        shell: pwsh
        run: Expand-Archive -Path "dependencies/projectM/ProjectM_Presets_Base.zip" -DestinationPath "${{ steps.host.outputs.dir }}/presets" -Force

      - name: Checkout plugins (pin to matching tag, else latest master)
        uses: actions/checkout@v4
        with:
          repository: PhosphorApp/phosphor-plugins
          path: _plugins
          fetch-depth: 0
          # Fetch tags too so we can resolve a matching plugins tag below.
          fetch-tags: true
          # A PAT is required while phosphor-plugins is private. Store it as a repo secret.
          token: ${{ secrets.PLUGINS_REPO_TOKEN }}

      - name: Resolve plugins ref (pin to host tag, fall back to master)
        id: pluginsref
        shell: pwsh
        # Reproducibility model: if the plugins repo carries a tag matching THIS host tag
        # (e.g. host v0.9.3-tester.2 -> plugins v0.9.3-tester.2), build that exact tagged plugin
        # source — a named, reproducible host+plugins pair. If no such tag exists (the common case
        # where plugins were untouched for this release), fall back to plugins master HEAD (latest)
        # with a warning. Either way the exact SHA is recorded in build-info.json for traceability.
        run: |
          $pin = "none"
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            git -C _plugins rev-parse -q --verify "refs/tags/$tag" 2>$null | Out-Null
            $tagFound = ($LASTEXITCODE -eq 0)
            # Reset so the failed lookup (a signal, not an error) doesn't propagate as the step's exit code.
            $global:LASTEXITCODE = 0
            if ($tagFound) {
              git -C _plugins checkout --quiet "refs/tags/$tag"
              $pin = $tag
              Write-Host "Pinned plugins to matching tag $tag"
            } else {
              Write-Host "::warning::No plugins tag '$tag' found — falling back to plugins master (latest). Tag plugins with '$tag' for a reproducible pair."
            }
          }
          "pin=$pin" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Record plugins commit
        id: plugins
        shell: pwsh
        run: echo "sha=$(git -C _plugins rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Build plugins into the host snapshot
        shell: pwsh
        env:
          # Self-deploy target writes each plug-in into <host>/plugins/<Name>/.
          PHOSPHOR_HOST_DIR: ${{ steps.host.outputs.dir }}
        run: |
          # Each plug-in owns its own version: its .csproj declares <Version> (e.g. SiriusXM 1.1.0),
          # which flows to FileVersion and is what the About page displays — so per-plug-in versions
          # are preserved through the release build instead of being flattened to the host version.
          # A plug-in that declares no version simply defaults to 1.0.0. AssemblyVersion stays pinned
          # at 1.0.0 for every plug-in — it is the binding identity the host's AssemblyLoadContext
          # resolves against and must not churn per build. The host release version is still recorded
          # in build-info.json (pluginsCommit/pluginsPin) for snapshot traceability.
          dotnet build _plugins/Phosphor.Plugins.slnx --configuration Release `
            -p:AssemblyVersion=1.0.0

      - name: Verify plugins were folded into the snapshot
        shell: pwsh
        # Guard against a "green but empty" release: if the plugins checkout/build produced no
        # plugins/<Name>/ folders, fail loudly here rather than shipping a plugin-less snapshot.
        run: |
          $pluginsDir = Join-Path "${{ steps.host.outputs.dir }}" "plugins"
          $folders = if (Test-Path $pluginsDir) { @(Get-ChildItem $pluginsDir -Directory) } else { @() }
          if ($folders.Count -eq 0) {
            Write-Error "No plug-ins found in $pluginsDir — the plugins checkout/build did not deploy anything. Failing the release."
            exit 1
          }
          Write-Host "Folded in $($folders.Count) plug-in(s): $($folders.Name -join ', ')"

      - name: Write build-info.json
        shell: pwsh
        run: |
          $hostDir = "${{ steps.host.outputs.dir }}"
          $abstractionsDll = Join-Path $hostDir "Phosphor.Plugin.Abstractions.dll"
          $contractVer = if (Test-Path $abstractionsDll) { (Get-Item $abstractionsDll).VersionInfo.FileVersion } else { $null }
          $info = [pscustomobject]@{
            hostVersion     = "${{ steps.ver.outputs.version }}"
            builtUtc        = (Get-Date).ToUniversalTime().ToString("o")
            pluginsCommit   = "${{ steps.plugins.outputs.sha }}"
            pluginsPin      = "${{ steps.pluginsref.outputs.pin }}"
            contractVersion = $contractVer
          }
          $info | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $hostDir "build-info.json")
          Get-Content (Join-Path $hostDir "build-info.json")

      - name: Package snapshot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path "${{ steps.host.outputs.dir }}/*" -DestinationPath "artifacts/Phosphor-${{ steps.ver.outputs.label }}.zip" -Force

      - name: Upload snapshot artifact (all runs)
        # Point at the snapshot DIRECTORY, not the .zip: GitHub's upload-artifact always wraps its
        # contents in one zip on download, so uploading the folder yields a single browsable zip
        # (files directly inside) rather than a zip-containing-a-zip. The tag-release path below still
        # attaches the pre-made single .zip directly (action-gh-release does not re-wrap).
        uses: actions/upload-artifact@v4
        with:
          name: Phosphor-${{ steps.ver.outputs.label }}
          path: ${{ steps.host.outputs.dir }}/**
          retention-days: 14

      - name: Create GitHub Release (tagged runs only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Phosphor ${{ steps.ver.outputs.label }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          files: artifacts/Phosphor-${{ steps.ver.outputs.label }}.zip
