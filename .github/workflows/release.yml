name: Release

# Produces a client snapshot: the host app + a point-in-time build of phosphor-plugins folded in.
# Distribution model = the client release IS the plugin snapshot (no in-app updater). The plugins
# commit SHA is stamped into build-info.json for traceability (a given release is traceable to the
# exact plugin source it shipped, even though it pulls plugins@latest rather than pinning versions).

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout host
        uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        # workflow_dispatch runs on a branch, so github.ref_name is e.g. "master" — NOT a version.
        # Only a v* tag yields a real version. Produce:
        #   version = a valid numeric build version (0.0.0 fallback for non-tag runs)
        #   label   = a human/file-safe name for the zip + release title
        run: |
          $ref = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -eq "tag" -and $ref -match '^v?\d+\.\d+\.\d+') {
            $version = $ref.TrimStart('v')
            $label   = $ref
          } else {
            $version = "0.0.0"
            $label   = "0.0.0-dev-$ref-${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "label=$label"     >> $env:GITHUB_OUTPUT
          Write-Host "Resolved version=$version label=$label (ref_type=${{ github.ref_type }}, ref=$ref)"

      - name: Build host (Release)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          dotnet build Phosphor.slnx --configuration Release `
            -p:Version=$v -p:AssemblyVersion=$v -p:FileVersion=$v

      - name: Resolve host output dir
        id: host
        shell: pwsh
        run: echo "dir=$(Resolve-Path 'Phosphor/bin/Release/net8.0-windows')" >> $env:GITHUB_OUTPUT

      - name: Extract ProjectM presets
        shell: pwsh
        run: Expand-Archive -Path "dependencies/projectM/ProjectM_Presets_Base.zip" -DestinationPath "${{ steps.host.outputs.dir }}/presets" -Force

      - name: Checkout plugins@latest
        uses: actions/checkout@v4
        with:
          repository: PhosphorApp/phosphor-plugins
          path: _plugins
          fetch-depth: 0
          # A PAT is required while phosphor-plugins is private. Store it as a repo secret.
          token: ${{ secrets.PLUGINS_REPO_TOKEN }}

      - name: Record plugins commit
        id: plugins
        shell: pwsh
        run: echo "sha=$(git -C _plugins rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Build plugins into the host snapshot
        shell: pwsh
        env:
          # Self-deploy target writes each plug-in into <host>/plugins/<Name>/.
          PHOSPHOR_HOST_DIR: ${{ steps.host.outputs.dir }}
        run: |
          dotnet build _plugins/Phosphor.Plugins.slnx --configuration Release

      - name: Verify plugins were folded into the snapshot
        shell: pwsh
        # Guard against a "green but empty" release: if the plugins checkout/build produced no
        # plugins/<Name>/ folders, fail loudly here rather than shipping a plugin-less snapshot.
        run: |
          $pluginsDir = Join-Path "${{ steps.host.outputs.dir }}" "plugins"
          $folders = if (Test-Path $pluginsDir) { @(Get-ChildItem $pluginsDir -Directory) } else { @() }
          if ($folders.Count -eq 0) {
            Write-Error "No plug-ins found in $pluginsDir — the plugins checkout/build did not deploy anything. Failing the release."
            exit 1
          }
          Write-Host "Folded in $($folders.Count) plug-in(s): $($folders.Name -join ', ')"

      - name: Write build-info.json
        shell: pwsh
        run: |
          $hostDir = "${{ steps.host.outputs.dir }}"
          $abstractionsDll = Join-Path $hostDir "Phosphor.Plugin.Abstractions.dll"
          $contractVer = if (Test-Path $abstractionsDll) { (Get-Item $abstractionsDll).VersionInfo.FileVersion } else { $null }
          $info = [pscustomobject]@{
            hostVersion     = "${{ steps.ver.outputs.version }}"
            builtUtc        = (Get-Date).ToUniversalTime().ToString("o")
            pluginsCommit   = "${{ steps.plugins.outputs.sha }}"
            contractVersion = $contractVer
          }
          $info | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $hostDir "build-info.json")
          Get-Content (Join-Path $hostDir "build-info.json")

      - name: Package snapshot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path "${{ steps.host.outputs.dir }}/*" -DestinationPath "artifacts/Phosphor-${{ steps.ver.outputs.label }}.zip" -Force

      - name: Upload snapshot artifact (all runs)
        uses: actions/upload-artifact@v4
        with:
          name: Phosphor-${{ steps.ver.outputs.label }}
          path: artifacts/Phosphor-${{ steps.ver.outputs.label }}.zip
          retention-days: 14

      - name: Create GitHub Release (tagged runs only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/Phosphor-${{ steps.ver.outputs.label }}.zip
